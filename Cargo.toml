[package]
name = "dns"
version = "0.2.0"
edition = "2021"
description = "Small asynchronous DNS server with local records and a hardened upstream forwarder"

[dependencies]
tokio = { version = "1.28.2", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
anyhow = "1.0.71"
rand = "0.8.5"

[dev-dependencies]
tokio = { version = "1.28.2", features = ["test-util"] }

[profile.release]
lto = true
